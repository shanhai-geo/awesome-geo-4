<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fb"/>
      <stop offset="1" stop-color="#e4e9f3"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="winShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>
    <clipPath id="discClip"><circle cx="640" cy="312" r="150"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>

  <!-- macOS browser window -->
  <g filter="url(#winShadow)">
    <rect x="58" y="46" width="1164" height="548" rx="18" fill="#ffffff"/>
  </g>
  <rect x="58" y="46" width="1164" height="548" rx="18" fill="none" stroke="#e6ebf3" stroke-width="1"/>
  <!-- title bar -->
  <path d="M58 64 a18 18 0 0 1 18 -18 h1128 a18 18 0 0 1 18 18 v40 h-1164 z" fill="#f6f8fc"/>
  <line x1="58" y1="104" x2="1222" y2="104" stroke="#e9edf4" stroke-width="1"/>
  <!-- traffic lights -->
  <circle cx="96" cy="75" r="7.5" fill="#ff5f57"/>
  <circle cx="124" cy="75" r="7.5" fill="#febc2e"/>
  <circle cx="152" cy="75" r="7.5" fill="#28c840"/>
  <!-- address bar -->
  <rect x="340" y="58" width="600" height="34" rx="17" fill="#eef1f7"/>
  <path d="M507 75 v-3 a5 5 0 0 1 10 0 v3 m-12 0 h14 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="530" y="80" font-family="'SF Mono','Menlo','DejaVu Sans Mono',monospace" font-size="15" fill="#64748b">github.com/aldegad/<tspan fill="#0f172a" font-weight="600">awesome-geo</tspan></text>

  <!-- line globe -->
  <circle cx="640" cy="312" r="150" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.7"/>
  <g clip-path="url(#discClip)">
    <line x1="490.0" y1="312" x2="790.0" y2="312" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.42"/>
    <line x1="510.1" y1="237.0" x2="769.9" y2="237.0" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
    <line x1="510.1" y1="387.0" x2="769.9" y2="387.0" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
    <line x1="565.0" y1="182.1" x2="715.0" y2="182.1" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
    <line x1="565.0" y1="441.9" x2="715.0" y2="441.9" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
    <line x1="640" y1="162.0" x2="640" y2="462.0" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.42"/>
    <ellipse cx="640" cy="312" rx="129.9" ry="150" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
    <ellipse cx="640" cy="312" rx="75.0" ry="150" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-opacity="0.30"/>
  </g>

  <!-- big logo wordmark stamped over the globe -->
  <text x="640" y="334" text-anchor="middle" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="800" font-size="68" letter-spacing="-2.5" fill="#0f172a">awesome<tspan fill="#2563eb">-geo</tspan></text>

  <!-- tagline + languages -->
  <text x="640" y="508" text-anchor="middle" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="600" font-size="20" letter-spacing="0.2" fill="#334155">A source-first map of GEO, AEO &amp; AI search</text>
  <text x="640" y="540" text-anchor="middle" font-family="'Helvetica Neue','Arial',sans-serif" font-weight="500" font-size="15" letter-spacing="0.3" fill="#94a3b8">English · 한국어 · 中文 · 日本語 · Español · Français</text>
</svg>