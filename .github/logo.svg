<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- awesome-geo icon: a line web globe as the lens of a magnifying glass,
       with an AI sparkle. Single azure stroke so it reads on light & dark. -->
  <defs>
    <clipPath id="lens"><circle cx="118" cy="118" r="86"/></clipPath>
  </defs>

  <!-- globe grid (clipped to the lens) -->
  <g clip-path="url(#lens)" stroke="#2563eb" fill="none">
    <line x1="32" y1="118" x2="204" y2="118" stroke-width="5" stroke-opacity="0.5"/>
    <line x1="43.5" y1="75" x2="192.5" y2="75" stroke-width="4.5" stroke-opacity="0.35"/>
    <line x1="43.5" y1="161" x2="192.5" y2="161" stroke-width="4.5" stroke-opacity="0.35"/>
    <line x1="75" y1="43.5" x2="161" y2="43.5" stroke-width="4.5" stroke-opacity="0.35"/>
    <line x1="75" y1="192.5" x2="161" y2="192.5" stroke-width="4.5" stroke-opacity="0.35"/>
    <line x1="118" y1="32" x2="118" y2="204" stroke-width="5" stroke-opacity="0.5"/>
    <ellipse cx="118" cy="118" rx="74.5" ry="86" stroke-width="4.5" stroke-opacity="0.35"/>
    <ellipse cx="118" cy="118" rx="43" ry="86" stroke-width="4.5" stroke-opacity="0.35"/>
  </g>

  <!-- lens ring -->
  <circle cx="118" cy="118" r="86" fill="none" stroke="#2563eb" stroke-width="9"/>

  <!-- magnifier handle -->
  <line x1="182" y1="182" x2="228" y2="228" stroke="#2563eb" stroke-width="17" stroke-linecap="round"/>

  <!-- AI sparkle -->
  <path d="M215 18 q4 14 18 18 q-14 4 -18 18 q-4 -14 -18 -18 q14 -4 18 -18 z" fill="#2563eb"/>
  <path d="M238 62 q2 7.5 9.5 9.5 q-7.5 2 -9.5 9.5 q-2 -7.5 -9.5 -9.5 q7.5 -2 9.5 -9.5 z" fill="#2563eb" fill-opacity="0.6"/>
</svg>
